<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>1, 2, 3 Soleil 🚦</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Connection panel ────────────────────────────────────────────────── -->
<div id="connect-panel">
  <div class="card">
    <div class="game-icon">🚦</div>
    <h1>1, 2, 3 Soleil</h1>
    <p class="subtitle">Le jeu Red Light Green Light<br>avec Reachy Mini</p>
    <div id="robot-picker"></div>
    <button id="btn-connect">Se connecter</button>
    <p id="connect-status"></p>
  </div>
</div>

<!-- ── Game panel ─────────────────────────────────────────────────────── -->
<div id="game-panel" class="hidden">

  <div class="game-header">
    <div class="round-badge" id="round-badge">Tour 1</div>
    <button id="btn-disconnect" class="btn-small">✕ Déconnecter</button>
  </div>

  <div id="phase-display">
    <div id="phase-emoji">🤖</div>
    <div id="phase-text">Prêt !</div>
    <div id="phase-sub"></div>
  </div>

  <div class="video-wrapper">
    <video id="robot-video" autoplay playsinline muted></video>
    <canvas id="motion-canvas" style="display:none"></canvas>
    <canvas id="overlay-canvas" class="motion-overlay"></canvas>
    <div class="video-label">📷 Vue du robot</div>
  </div>
  <div id="video-debug" class="video-debug"></div>

  <div class="motion-section">
    <div class="motion-label">
      <span>Mouvement détecté</span>
      <span id="motion-value">–</span>
    </div>
    <div class="motion-track">
      <div class="motion-fill" id="motion-fill"></div>
      <div class="motion-threshold-line" id="threshold-line"></div>
    </div>
  </div>

  <div class="controls-section">
    <label class="slider-label">
      Seuil de détection : <strong id="threshold-display">10</strong>
      <input type="range" id="threshold-slider" min="1" max="50" value="10">
      <span class="slider-hints"><span>Sensible</span><span>Tolérant</span></span>
    </label>
    <button id="btn-game" class="btn-game">▶ Commencer</button>
  </div>

</div>

<script type="module">
import { ReachyMini } from "https://cdn.jsdelivr.net/gh/pollen-robotics/reachy_mini@v1.7.3/js/reachy-mini.js";

// ── State ──────────────────────────────────────────────────────────────────
const robot = new ReachyMini({ appName: "rlgl-123-soleil" });
let running    = false;
let round      = 0;
let threshold  = 10;
let antennaTimer = null;
let bodyYawDeg  = 0; // tracked body yaw target for interpolation
let headYawDeg  = 0; // tracked head yaw (relative to body) for interpolation

// ── DOM ────────────────────────────────────────────────────────────────────
const qs = id => document.getElementById(id);

const connectPanel   = qs('connect-panel');
const gamePanel      = qs('game-panel');
const btnConnect     = qs('btn-connect');
const btnDisconnect  = qs('btn-disconnect');
const btnGame        = qs('btn-game');
const connectStatus  = qs('connect-status');
const roundBadge     = qs('round-badge');
const phaseEmoji     = qs('phase-emoji');
const phaseText      = qs('phase-text');
const phaseSub       = qs('phase-sub');
const robotVideo     = qs('robot-video');
const motionCanvas   = qs('motion-canvas');
const motionCtx      = motionCanvas.getContext('2d');
const overlayCanvas  = qs('overlay-canvas');
const overlayCtx     = overlayCanvas.getContext('2d');
const motionFill     = qs('motion-fill');
const motionValue    = qs('motion-value');
const thresholdLine  = qs('threshold-line');
const thresholdSlider = qs('threshold-slider');
const thresholdDisplay = qs('threshold-display');

// ── Video — attach early (lazy: wires when track arrives) ─────────────────
robot.attachVideo(robotVideo);

// Debug: poll video state every second and show it in the UI
const videoDebug = qs('video-debug');
setInterval(() => {
  const s = robotVideo.srcObject;
  const tracks = s ? s.getVideoTracks() : [];
  videoDebug.textContent = s
    ? `flux: ${tracks.length} piste(s) · ${robotVideo.videoWidth}×${robotVideo.videoHeight} · état ${robotVideo.readyState}`
    : 'pas de flux';
}, 1000);

// ── SDK events ─────────────────────────────────────────────────────────────
robot.addEventListener('streaming', () => {
  robotVideo.play().catch(() => {});
  show(gamePanel);
  hide(connectPanel);
  setPhase('🤖', 'Prêt à jouer !', 'Appuie sur Commencer');
});

robot.addEventListener('videoTrack', () => {
  robotVideo.play().catch(() => {});
});

robot.addEventListener('disconnected', () => {
  stopGame();
  show(connectPanel);
  hide(gamePanel);
  connectStatus.textContent = 'Déconnecté.';
  btnConnect.disabled = false;
  btnConnect.textContent = 'Se connecter';
});

robot.addEventListener('error', e => {
  connectStatus.textContent = `Erreur : ${e.detail?.message ?? 'inconnue'}`;
});

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  positionThresholdLine();

  btnConnect.addEventListener('click', async () => {
    btnConnect.disabled = true;
    btnConnect.textContent = 'Connexion…';
    connectStatus.textContent = '';
    try {
      await robot.autoConnect({ pickRobot: robots => pickRobot(robots) });
    } catch (e) {
      if (e.message?.toLowerCase().includes('not authenticated')) {
        await robot.login(); // redirige vers HF OAuth, puis revient ici
        return;
      }
      connectStatus.textContent = e.message ?? 'Connexion échouée.';
      btnConnect.disabled = false;
      btnConnect.textContent = 'Réessayer';
    }
  });

  btnDisconnect.addEventListener('click', () => {
    stopGame();
    robot.stopSession();
    robot.disconnect();
  });

  btnGame.addEventListener('click', () => running ? stopGame() : startGame());

  thresholdSlider.addEventListener('input', () => {
    threshold = Number(thresholdSlider.value);
    thresholdDisplay.textContent = threshold;
    positionThresholdLine();
  });
});

function positionThresholdLine() {
  thresholdLine.style.left = `${(threshold / 50) * 100}%`;
}

// ── Robot picker ───────────────────────────────────────────────────────────
function pickRobot(robots) {
  return new Promise((resolve, reject) => {
    const picker = qs('robot-picker');
    picker.innerHTML = '<p class="picker-label">Choisir un robot :</p>';
    robots.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'picker-btn';
      btn.textContent = r.name || r.id;
      btn.onclick = () => { picker.innerHTML = ''; resolve(r.id); };
      picker.appendChild(btn);
    });
  });
}

// ── Game control ───────────────────────────────────────────────────────────
async function startGame() {
  running = true;
  round   = 0;
  btnGame.textContent = '⏹ Arrêter';
  btnGame.classList.add('danger');
  // Force "enabled" so body_rotation responds to position commands.
  // ensureAwake() uses gravity_compensation which lets the head float
  // but may block body yaw commands.
  await robot.setMotorMode('enabled');
  gameLoop();
}

function stopGame() {
  running = false;
  clearAntenna();
  btnGame.textContent = '▶ Commencer';
  btnGame.classList.remove('danger');
  animateTurnBack(600);
  robot.setAntennasDeg(0, 0);
  setPhase('🤖', 'Jeu arrêté', 'Appuie sur Commencer pour rejouer');
}

// ── Turn animations ─────────────────────────────────────────────────────────
// The WebRTC daemon caps body_yaw around 40°. We compound it with head yaw
// (max 55°, within the 65° delta limit) for ~95° of total visible rotation.
// Both axes interpolate together at 25 Hz with ease-in-out.

const DEG         = Math.PI / 180;
const BODY_TARGET = 160; // daemon clamps to its effective limit (~90°)

async function animateTurnAway(durationMs) {
  const bStart = bodyYawDeg;
  const steps  = Math.max(1, Math.round(durationMs / 40));
  const stepMs = durationMs / steps;
  for (let i = 1; i <= steps; i++) {
    const t    = i / steps;
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const b    = bStart + (BODY_TARGET - bStart) * ease;
    // Head yaw tracks body yaw in world frame → delta ≈ 0° → no constraint on body
    robot.setTarget({ body_yaw: b * DEG });
    robot.setHeadRpyDeg(0, 15 * ease, b);
    await sleep(stepMs);
  }
  bodyYawDeg = BODY_TARGET;
}

async function animateTurnBack(durationMs) {
  const bStart = bodyYawDeg;
  const steps  = Math.max(1, Math.round(durationMs / 40));
  const stepMs = durationMs / steps;
  for (let i = 1; i <= steps; i++) {
    const t    = i / steps;
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const b    = bStart * (1 - ease);
    // Keep head in sync on the way back too
    robot.setTarget({ body_yaw: b * DEG });
    robot.setHeadRpyDeg(0, 0, b);
    await sleep(stepMs);
  }
  robot.setHeadRpyDeg(0, 0, 0);
  bodyYawDeg = 0;
}

// ── Game loop ──────────────────────────────────────────────────────────────
async function gameLoop() {
  while (running) {
    round++;
    roundBadge.textContent = `Tour ${round}`;
    await playRound();
    if (running) await sleep(500);
  }
}

async function playRound() {

  // ── 1. Turn away — body yaw + head yaw combined (~95° total) ────────────
  setPhase('🔄', 'Je me retourne…', '');
  clearAntenna();
  robot.setAntennasDeg(-15, -15);
  await animateTurnAway(2000);
  if (!running) return;

  // ── 2. Count aloud (head stays turned, only pitch nods) ──────────────────
  setPhase('🔢', 'Un, deux, trois…', 'Vous pouvez bouger !');
  startAntennaWiggle();

  for (let i = 0; i < 3; i++) {
    robot.setHeadRpyDeg(0, 10 + Math.random() * 15, BODY_TARGET);
    robot.playSound('count.wav');
    await sleep(600 + Math.random() * 800);
    if (!running) return;
  }

  await sleep(200 + Math.random() * 400);
  if (!running) return;
  robot.setHeadRpyDeg(0, 5, BODY_TARGET);
  robot.playSound('dance1.wav');
  await sleep(800);
  clearAntenna();
  if (!running) return;

  // ── 3. Snap back — fast 0.5 s ────────────────────────────────────────────
  setPhase('👀', 'SOLEIL !', '');
  robot.setAntennasDeg(30, 30);
  await animateTurnBack(500);
  await sleep(300);
  if (!running) return;

  // ── 4. Theatrical head scan ──────────────────────────────────────────────
  setPhase('🔍', 'Qui a bougé ?', 'IMMOBILES !');
  robot.setAntennasDeg(50, 50);
  robot.playSound('confused1.wav');
  robot.setHeadRpyDeg(0, 0, -35);
  await sleep(500);
  robot.setHeadRpyDeg(0, 0, 35);
  await sleep(500);
  robot.setHeadRpyDeg(0, 0, 0);
  await sleep(400);
  if (!running) return;

  // ── 5. Detect motion (4 s) ──────────────────────────────────────────────
  const { caught, cx, cy } = await detectMotion(4000);
  if (!running) return;

  // ── 6. React ────────────────────────────────────────────────────────────
  if (caught) {
    // cx/cy in [0,1]: convert centroid to head angles to "accuse" the mover
    const accuseYaw   = (cx - 0.5) * 70;  // left/right in image → head yaw
    const accusePitch = (cy - 0.5) * 30;  // top/bottom in image → head pitch
    setPhase('🚨', 'JE T\'AI VU !', 'Tu as perdu !');
    robot.setAntennasDeg(60, 60);
    robot.setHeadRpyDeg(0, accusePitch, accuseYaw);
    robot.playSound('impatient1.wav');
    await sleep(2500);
    robot.setAntennasDeg(0, 0);
    robot.setHeadRpyDeg(0, 0, 0);
    await sleep(400);
  } else {
    setPhase('✅', 'Bien joué !', 'Personne n\'a bougé');
    robot.setAntennasDeg(0, 0);
    robot.setHeadRpyDeg(0, 0, 0);
    await sleep(600);
  }
}

// ── Motion detection ───────────────────────────────────────────────────────
async function detectMotion(duration) {
  if (!robotVideo.videoWidth) return { caught: false, cx: 0.5, cy: 0.5 };

  overlayCanvas.style.opacity = '1';
  const end = Date.now() + duration;
  let prev    = captureFrame();
  let maxDiff = 0;
  let bestCx  = 0.5, bestCy = 0.5;

  while (Date.now() < end && running) {
    await sleep(80);
    const cur = captureFrame();
    const { diff: d, cx, cy } = diffAndPaint(prev, cur);
    if (d > maxDiff) { maxDiff = d; bestCx = cx; bestCy = cy; }
    setMotionBar(d);
    prev = cur;
  }

  overlayCanvas.style.opacity = '0';
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  setMotionBar(0);
  motionValue.textContent = maxDiff.toFixed(1);
  return { caught: maxDiff > threshold, cx: bestCx, cy: bestCy };
}

// Capture the current video frame onto the hidden canvas
function captureFrame() {
  const w = robotVideo.videoWidth;
  const h = robotVideo.videoHeight;
  if (!w || !h) return null;
  motionCanvas.width  = w;
  motionCanvas.height = h;
  motionCtx.drawImage(robotVideo, 0, 0);
  return motionCtx.getImageData(0, 0, w, h);
}

// Compare two frames, paint an orange heatmap on the overlay canvas,
// and return the average per-pixel diff plus the weighted motion centroid in [0,1].
function diffAndPaint(a, b) {
  if (!a || !b || a.data.length !== b.data.length) return { diff: 0, cx: 0.5, cy: 0.5 };

  const w = a.width, h = a.height;
  overlayCanvas.width  = w;
  overlayCanvas.height = h;

  const heat = overlayCtx.createImageData(w, h);
  const d1 = a.data, d2 = b.data, out = heat.data;
  let sum = 0, wx = 0, wy = 0, wsum = 0;

  for (let i = 0; i < d1.length; i += 4) {
    const px = (Math.abs(d1[i]-d2[i]) + Math.abs(d1[i+1]-d2[i+1]) + Math.abs(d1[i+2]-d2[i+2])) / 3;
    sum += px;
    if (px > 10) {
      out[i]   = 255;
      out[i+1] = Math.max(0, 120 - px);
      out[i+2] = 0;
      out[i+3] = Math.min(230, px * 6);
      const pi = i >> 2;
      wx   += (pi % w) * px;
      wy   += Math.floor(pi / w) * px;
      wsum += px;
    }
  }

  overlayCtx.putImageData(heat, 0, 0);

  const cx = wsum > 0 ? wx / wsum / w : 0.5;
  const cy = wsum > 0 ? wy / wsum / h : 0.5;

  // Draw target crosshair at motion centroid when there is significant motion
  if (wsum > 0) {
    const tx = cx * w, ty = cy * h, r = Math.max(18, w * 0.04);
    overlayCtx.save();
    overlayCtx.strokeStyle = '#fff';
    overlayCtx.lineWidth = 2;
    overlayCtx.shadowColor = '#ff4400';
    overlayCtx.shadowBlur = 8;
    overlayCtx.beginPath();
    overlayCtx.arc(tx, ty, r, 0, Math.PI * 2);
    overlayCtx.stroke();
    // Crosshair lines
    overlayCtx.beginPath();
    overlayCtx.moveTo(tx - r * 1.5, ty); overlayCtx.lineTo(tx - r * 0.4, ty);
    overlayCtx.moveTo(tx + r * 0.4, ty); overlayCtx.lineTo(tx + r * 1.5, ty);
    overlayCtx.moveTo(tx, ty - r * 1.5); overlayCtx.lineTo(tx, ty - r * 0.4);
    overlayCtx.moveTo(tx, ty + r * 0.4); overlayCtx.lineTo(tx, ty + r * 1.5);
    overlayCtx.stroke();
    overlayCtx.restore();
  }

  return { diff: sum / (d1.length / 4) / 3, cx, cy };
}

function setMotionBar(v) {
  const pct = Math.min((v / 50) * 100, 100);
  motionFill.style.width      = `${pct}%`;
  motionFill.style.background = v > threshold ? '#e74c3c' : '#2ecc71';
}

// ── Antenna animation ──────────────────────────────────────────────────────
function startAntennaWiggle() {
  let t = 0;
  antennaTimer = setInterval(() => {
    const a = 40 * Math.sin(t * 1.1);
    robot.setAntennasDeg(a, -a);
    t++;
  }, 110);
}

function clearAntenna() {
  if (antennaTimer) { clearInterval(antennaTimer); antennaTimer = null; }
}

// ── Utilities ──────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
const show  = el => el.classList.remove('hidden');
const hide  = el => el.classList.add('hidden');

function setPhase(emoji, text, sub) {
  phaseEmoji.textContent = emoji;
  phaseText.textContent  = text;
  phaseSub.textContent   = sub;
}
</script>
</body>
</html>
